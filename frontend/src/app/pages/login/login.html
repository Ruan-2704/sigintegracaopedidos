<main class="login-page">
  <section class="login-hero" aria-label="SIG Cotacao"></section>

  <section class="login-panel">
    <form class="login-card" (ngSubmit)="entrar()">
      <div class="login-brand">
        <img src="assets/logo-sicotacao.webp" alt="SIG Cotacao" />
        <div>
          <small>Painel operacional</small>
          <strong>SIG Cotacao</strong>
        </div>
      </div>

      <div class="login-heading">
        <h2>Acesso ao painel</h2>
        <p>Informe o usuario e a senha para acessar o painel.</p>
      </div>

      <label>Usuario</label>
      <div class="input-line">
        <span>*</span>
        <input name="usuario" [(ngModel)]="usuario" placeholder="Digite o usuario" />
      </div>

      <label>Senha</label>
      <div class="input-line">
        <span>#</span>
        <input name="token" [(ngModel)]="token" type="password" placeholder="Digite a senha" />
      </div>

      <button type="submit" [disabled]="carregando || !token.trim()">
        {{ carregando ? 'Validando acesso...' : 'Acessar painel' }}
      </button>

      <div *ngIf="erro" class="erro">{{ erro }}</div>
      <small class="version">SIG Cotacao - Integracoes Cotefacil / SmartPed</small>
    </form>
  </section>
</main>
