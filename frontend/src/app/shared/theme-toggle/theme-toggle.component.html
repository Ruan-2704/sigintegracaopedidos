<div class="theme-switch" role="group" aria-label="Escolher tema">
  <button *ngFor="let option of options" type="button" [class.active]="theme.preference === option.value"
    [attr.aria-pressed]="theme.preference === option.value" [attr.aria-label]="'Tema ' + option.label"
    [title]="'Tema ' + option.label" (click)="setTheme(option.value)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="option.path" /></svg>
    <span>{{ option.label }}</span>
  </button>
</div>
